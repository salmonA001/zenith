[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["third_party/windows-link"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.34", features = ["serde"] }
lz4_flex = "0.14"
png = "0.18"
pollster = "1"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
winit = "0.30"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"

# rustup alone can build on Windows: see third_party/windows-link/src/lib.rs.
[patch.crates-io]
windows-link = { path = "third_party/windows-link" }

# Dependencies are optimised even in dev builds: a debug wgpu makes the game unplayable,
# and with no debug info for them the target directory stays small.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
opt-level = 3
debug = false
